<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'">
  <title>拾光 · 桌面工作球</title>
  <link rel="stylesheet" href="base.css"><link rel="stylesheet" href="orb.css">
</head>
<body>
  <button id="orb" class="orb" type="button" aria-label="下班啦，单击签到，双击打开工时日历" title="单击签到 · 双击看日历 · 按住拖动 · 右键更多">
    <span class="orb-shine" aria-hidden="true"></span>
    <span class="face" aria-hidden="true"><i></i><b></b><i></i></span>
    <span class="peek-face" aria-hidden="true"><span class="peek-eyes"><i><b></b></i><i><b></b></i></span><span class="peek-mouth"></span></span>
    <span class="status" id="status">下班啦</span>
    <span class="time" id="time">00:00:00</span>
    <span class="action" id="action">签到</span>
    <span class="save-warning" id="save-warning" hidden>暂未保存</span>
  </button>
  <script type="module" src="orb.js"></script>
</body>
</html>
