<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f3f7ef"><title>拾光 · 随身看工时</title><link rel="stylesheet" href="/style.css"></head>
<body><main>
  <header><a class="brand" href="/" aria-label="拾光首页"><span class="brand-orb"><i></i><i></i></span>拾光<span class="brand-note">随身看工时</span></a><button id="logout" class="quiet" hidden>退出登录</button></header>
  <section id="login" class="login-card" hidden>
    <div class="login-art" aria-hidden="true"><span>✧</span><div class="large-orb"><i></i><i></i><b></b></div><span>✳</span></div>
    <p class="eyebrow">YOUR LITTLE WORK COMPANION</p><h1>走到哪里，<br>都看得见今天的努力。</h1><p class="muted">登录后，看看电脑上的拾光记录到哪儿了。</p>
    <form id="login-form"><label for="password">查看密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="输入你的查看密码"><button id="login-button" type="submit" class="primary">打开我的拾光 <span>↗</span></button><p id="login-error" class="error" role="alert" hidden></p></form>
    <p class="fine-print">此页面只查看工时，打卡和修改记录请在电脑上操作。</p>
  </section>
  <section id="dashboard" hidden>
    <div class="hello"><div><p class="eyebrow" id="today-label">TODAY</p><h1>认真过的时间，<br>正在一点点发光。</h1></div><span class="hello-star" aria-hidden="true">✳</span></div>
    <div class="connection-strip"><span class="connection-dot" id="connection-dot"></span><strong id="connection-status">正在连接</strong><span id="last-sync"></span></div>
    <article class="today-card"><div class="card-label"><span>今日累计工时</span><span id="work-mode" class="pill">等待同步</span></div><div class="today-clock" id="today-clock">00:00:00</div><p id="today-note">等待电脑上的拾光连接。</p><div class="tiny-orb" aria-hidden="true"><i></i><i></i></div></article>
    <article class="month-card"><div class="card-label"><span id="month-label">本月累计</span><span class="small-star" aria-hidden="true">✧</span></div><div class="month-hours"><strong id="month-hours">0.0</strong><span>小时</span></div><div class="progress" id="progress" role="progressbar" aria-label="月度目标进度" aria-valuemin="0" aria-valuemax="100"><div id="progress-fill"></div></div><p class="goal-note" id="goal-note"></p><div class="milestones" id="milestones"></div></article>
    <article class="income-card"><div><span id="income-label">达标后有望获得</span><strong id="income">CNY 800.0<small>/月</small></strong></div><div class="income-flower" aria-hidden="true">✿</div><p>按你在电脑上设置的月度规则估算。</p></article>
    <p id="offline-note" class="offline-note" hidden>电脑离线，当前显示最后一次同步的记录。</p>
    <footer><span>工时从电脑上的拾光同步</span><span>只读查看 · 安心陪伴</span></footer>
  </section>
  <p id="initial-status" class="initial-status" role="status">正在打开拾光…</p>
</main><script type="module" src="/app.js"></script></body></html>
