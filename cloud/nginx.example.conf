# Add a dedicated virtual host. Use certificates already provisioned for your domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shiguang.example.com;
    ssl_certificate /etc/letsencrypt/live/shiguang.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shiguang.example.com/privkey.pem;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:18768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
server {
    listen 80;
    listen [::]:80;
    server_name shiguang.example.com;
    return 301 https://$host$request_uri;
}
